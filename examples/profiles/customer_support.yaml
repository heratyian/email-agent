id: customer_support
name: Customer Support Agent
version: 1
account: customer_support
model:
  provider: ollama
  model: qwen3
  temperature: 0
prompts:
  version: 1
  system: prompts/customer_support/system.md
  classify: prompts/customer_support/classify.md
  reply: prompts/customer_support/reply.md
behavior:
  default_tone: friendly, clear, and concise
  max_reply_words: 150
  intents: [bug_report, billing_question, feature_request, how_to, account_problem, receipt_processing_problem, login_problem, refund_request, sales_question, spam, unknown]
  escalation_rules: [billing dispute, refund request, security issue, legal complaint, data deletion request, angry customer, unknown product behavior]
  ignored_rules: [spam, newsletters, automated receipts]
  company_context: Receipt AI helps users upload and process receipts. Never invent product behavior or policy.
safety:
  allow_drafts: true
  allow_send: false

