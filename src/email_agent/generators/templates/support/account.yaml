model:
  provider: "{{MODEL_PROVIDER}}"
  model: "{{MODEL_NAME}}"
  temperature: 0
classification_prompt: "{{PROMPT_DIR}}/classification.md"
draft_prompt: "{{PROMPT_DIR}}/draft.md"
categories:
  action: A customer request that needs a reply or team action.
  important: Security, legal, billing, or escalated customer communication.
  receipts: Invoices, payments, and transaction confirmations.
  newsletters: Subscriptions, product announcements, and recurring publications.
  reference: Useful customer or product information requiring no action.
  noise: Spam or irrelevant automated mail.
