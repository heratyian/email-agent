name: "{{AGENT_NAME}}"
version: 1
model:
  provider: "{{MODEL_PROVIDER}}"
  model: "{{MODEL_NAME}}"
  temperature: 0
prompts:
  version: 1
  system: "{{PROMPT_DIR}}/system.md"
  classify: "{{PROMPT_DIR}}/classify.md"
  reply: "{{PROMPT_DIR}}/reply.md"
behavior:
  default_tone: warm and concise
  max_reply_words: 120
  escalation_rules:
    - financial commitments
    - legal matters
    - sensitive personal information
  ignored_rules:
    - spam
    - newsletters
    - automated receipts
safety:
  allow_drafts: true
  allow_send: false
