name: "{{AGENT_NAME}}"
version: 1
model:
  provider: "{{MODEL_PROVIDER}}"
  model: "{{MODEL_NAME}}"
  temperature: 0
system_prompt: "{{PROMPT_DIR}}/system.md"
categories:
  action: Requires a reply, decision, or other action from me.
  important: Important information that deserves my attention.
  receipts: Purchases, invoices, and payment confirmations.
  newsletters: Subscriptions and recurring publications.
  reference: Useful information requiring no action.
  noise: Spam or low-value automated mail.
organization:
  enabled: true
  prefix: Email Agent
safety:
  allow_drafts: true
  allow_send: false
